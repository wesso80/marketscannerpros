services:
  - type: web
    name: marketscannerpros
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALPHA_VANTAGE_RPM
        value: "600"  # matches Render dashboard (2026-09-27)
      # Cap V8 old-space at 1536 MB on the 2 GB Standard instance so GC
      # pressure kicks in before the container's cgroup OOM-killer or the
      # native cppgc heap (used by ContextifyScript during SSR compilation)
      # runs out of headroom and triggers SIGABRT (status 134).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: AI_GATEWAY_API_KEY
        sync: false
      # Read-only bot key for GET /api/admin/crypto-markets/summary. Set the value on Render; never commit it.
      - key: CRYPTO_SUMMARY_KEY
        sync: false

  # ==========================================================================
  # Background Worker: Data Ingestion (Alpha Vantage) + job scheduler
  # Fetches OHLCV data, computes indicators locally, stores in DB + Redis
  # This eliminates per-user API calls - all users read from cache.
  # Since 2026-10-02 it also runs the job schedule in lib/worker/schedule.ts
  # (worker/scheduler.ts): the 43 curl/script cron services that used to live
  # in this file. Render bills each cron job a flat monthly minimum and
  # rebuilds every one on each deploy; the always-on worker fires the same
  # POSTs with the same x-cron-secret for nothing extra. Set
  # WORKER_SCHEDULER_ENABLED=false to pause it.
  # ==========================================================================
  - type: worker
    name: msp-data-worker
    runtime: node
    buildCommand: npm install
    startCommand: npm run worker:ingest
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_RPM
        value: "200"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      # Scheduler target and auth: the same values the cron services used.
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: CRON_SECRET

  # The one platform-run backstop: paper exits are checked every 15 minutes
  # even if the worker (and its scheduler) is down. Deliberately NOT in the
  # worker schedule so it never double-fires.
  - type: cron
    name: arca-cycle
    runtime: node
    schedule: "*/15 * * * *"  # Every 15m, 24/7 (ARCA holds crypto) - SIMULATED ARCA cycle per active workspace
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 600 -X POST "$WEB_URL/api/cron/arca-cycle" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  # -----------------------------------------------------------------
  # PRIVATE JARVIS — overnight opportunity radar (owner-only research).
  # Runs the scan script directly (no HTTP route, nothing public). Kept as
  # real cron jobs: ~20 minutes and ~200 MB RSS, too heavy for the Starter
  # worker. Two UTC schedules straddle US DST; the script only proceeds when
  # America/New_York time is 16:45–18:30 on a weekday and no run exists for
  # that NY date, so exactly one executes per session.
  # -----------------------------------------------------------------
  - type: cron
    name: jarvis-overnight-radar-a
    runtime: node
    schedule: "15 21 * * 1-5"
    buildCommand: npm install
    startCommand: npm run jarvis:scan -- --scheduled
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: DATABASE_URL
      - key: ALPHA_VANTAGE_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: ALPHA_VANTAGE_API_KEY
      - key: ALPHA_VANTAGE_RPM
        value: "120"
      - key: COINGECKO_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: COINGECKO_API_KEY
      - key: JARVIS_EQUITY_MAX
        value: "2000"
      - key: JARVIS_OVERVIEW_BUDGET
        value: "200"
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: RESEND_API_KEY
      - key: JARVIS_DAILY_REPORT_TO
        sync: false
      - key: JARVIS_REPORT_BASE_URL
        value: "https://marketscannerpros.app"

  - type: cron
    name: jarvis-overnight-radar-b
    runtime: node
    schedule: "15 22 * * 1-5"
    buildCommand: npm install
    startCommand: npm run jarvis:scan -- --scheduled
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: DATABASE_URL
      - key: ALPHA_VANTAGE_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: ALPHA_VANTAGE_API_KEY
      - key: ALPHA_VANTAGE_RPM
        value: "120"
      - key: COINGECKO_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: COINGECKO_API_KEY
      - key: JARVIS_EQUITY_MAX
        value: "2000"
      - key: JARVIS_OVERVIEW_BUDGET
        value: "200"
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: RESEND_API_KEY
      - key: JARVIS_DAILY_REPORT_TO
        sync: false
      - key: JARVIS_REPORT_BASE_URL
        value: "https://marketscannerpros.app"

  # Pre-morning crypto-only refresh of the latest persisted run (no AV calls).
  # 20:00Z = 06:00 AEST / 07:00 AEDT — shortly before the owner reads it.
  - type: cron
    name: jarvis-crypto-refresh
    runtime: node
    schedule: "0 20 * * *"
    buildCommand: npm install
    startCommand: npm run jarvis:scan -- --refresh-crypto
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: DATABASE_URL
      - key: COINGECKO_API_KEY
        fromService:
          type: web
          name: marketscannerpros
          envVarKey: COINGECKO_API_KEY
