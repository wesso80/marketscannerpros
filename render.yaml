services:
  - type: web
    name: marketscannerpros
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALPHA_VANTAGE_RPM
        value: "400"

  # ==========================================================================
  # Background Worker: Data Ingestion (Alpha Vantage)
  # Fetches OHLCV data, computes indicators locally, stores in DB + Redis
  # This eliminates per-user API calls - all users read from cache
  # ==========================================================================
  - type: worker
    name: msp-data-worker
    runtime: node
    buildCommand: npm install
    startCommand: npm run worker:ingest
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_RPM
        value: "200"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: COINGECKO_API_KEY
        sync: false

  # Cron Jobs for Alerts
  - type: cron
    name: alerts-price-check
    runtime: node
    schedule: "0-59/5 * * * *"  # Every 5 minutes (offset :00)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/alerts/check" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alerts-signal-check
    runtime: node
    schedule: "3-59/10 * * * *"  # Every 10 minutes (offset :03)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/alerts/signal-check" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alerts-smart-check
    runtime: node
    schedule: "1-59/5 * * * *"  # Every 5 minutes (offset :01) - derivatives/OI/funding alerts
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/alerts/smart-check" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: alerts-strategy-check
    runtime: node
    schedule: "4,19,34,49 * * * *"  # Every 15 minutes (offset :04)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/alerts/strategy-check" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: daily-market-focus
    runtime: node
    schedule: "0 21 * * *"  # 9 PM UTC daily
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/jobs/generate-market-focus" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: daily-scan
    runtime: node
    schedule: "30 21 * * *"  # 9:30 PM UTC daily
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 290 -X POST "$WEB_URL/api/jobs/scan-daily" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: prewake-universe-scan
    runtime: node
    schedule: "35 19 * * *"  # 7:35 PM UTC daily - refresh broad universe before morning brief
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 2 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 290 -X POST "$WEB_URL/api/jobs/scan-universe" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: opportunity-scan
    runtime: node
    schedule: "7,37 * * * *"  # Every 30 minutes (offset :07) - scanner→Discord posting + trade suggestions
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/jobs/opportunity-scan" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  # Admin radar — always-on opportunity finder (research only, no execution).
  # Refreshes the in-memory liveRadar visible at /admin/live-scanner and /admin/opportunity-board
  # so the radar is fresh even when no admin tab is open. Discovery analytics only.
  - type: cron
    name: admin-radar-crypto
    runtime: node
    schedule: "*/15 * * * *"  # Crypto: every 15 minutes (24/7 markets)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 2 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 60 -X POST "$WEB_URL/api/operator/engine/auto-scan" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json" --data '{"watchlist":"crypto-majors","timeframe":"15m"}'
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-radar-equity-megacap
    runtime: node
    schedule: "5,35 13-20 * * 1-5"  # US session only (9:05a–4:35p ET, every 30 min, M–F)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 2 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 90 -X POST "$WEB_URL/api/operator/engine/auto-scan" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json" --data '{"watchlist":"us-mega-cap","timeframe":"15m"}'
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-radar-equity-momentum
    runtime: node
    schedule: "20,50 13-20 * * 1-5"  # US session only, offset 30 min from megacap to spread AV calls
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 2 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 90 -X POST "$WEB_URL/api/operator/engine/auto-scan" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json" --data '{"watchlist":"us-momentum","timeframe":"15m"}'
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: catalyst-study-compute
    runtime: node
    schedule: "14,44 * * * *"  # Every 30 minutes (offset :14) - incremental catalyst study computation
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 1 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 270 -X POST "$WEB_URL/api/catalyst/study/compute?limit=5" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: catalyst-overnight-bulk
    runtime: node
    schedule: "0 22 * * *"  # 10 PM UTC (5 PM ET) - bulk compute after market close
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 1 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 270 -X POST "$WEB_URL/api/catalyst/study/compute?limit=50" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: catalyst-news-ingest
    runtime: node
    schedule: "12,42 * * * *"  # Every 30 minutes (offset :12) - ingest AV news + SEC filings
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 180 -X POST "$WEB_URL/api/catalyst/ingest" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: daily-operator-morning-brief
    runtime: node
    schedule: "15 20 * * *"  # 8:15 PM UTC daily - after prewake universe refresh
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 180 -X POST "$WEB_URL/api/jobs/email-morning-brief" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json" --data '{"scanLimit":80}'
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_DAILY_BRIEF_EMAILS
        sync: false

  - type: cron
    name: daily-best-opportunities-email
    runtime: node
    schedule: "0 12 * * *"  # 12:00 PM UTC daily (~7 AM ET pre-bell) - best crypto/equity/options digest
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 290 -X POST "$WEB_URL/api/jobs/email-best-opportunities" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_DAILY_BRIEF_EMAILS
        sync: false

  - type: cron
    name: daily-operator-review-email
    runtime: node
    schedule: "30 7 * * 1-5"  # 7:30 AM UTC weekdays - post-session execution review
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 180 -X POST "$WEB_URL/api/jobs/email-daily-review" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_DAILY_BRIEF_EMAILS
        sync: false

  - type: cron
    name: label-signal-outcomes
    runtime: node
    schedule: "7 2,8,14,20 * * *"  # Every 6 hours - label operator signal outcomes after 24h
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/cron/label-ai-outcomes" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: learning-outcomes
    runtime: node
    schedule: "9,24,39,54 * * * *"  # Every 15 minutes (offset :09) - process learning machine predictions
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/jobs/learning-outcomes" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: journal-auto-close
    runtime: node
    schedule: "2-59/5 * * * *"  # Every 5 minutes (offset :02) - auto-close TP/SL/time-stop eligible journal trades
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 120 -X POST "$WEB_URL/api/jobs/journal-auto-close?limit=200" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: stale-auto-draft-cleanup
    runtime: node
    schedule: "15 0 * * *"  # Daily at 00:15 UTC - close stale scanner auto drafts older than 48h
    buildCommand: npm install
    startCommand: npm run worker:cleanup:stale-auto-drafts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # ========================================================================
  # UPE Scheduler Wiring (Phase D)
  # US session aligned using UTC schedules (EST baseline; adjust seasonally)
  # ========================================================================
  - type: cron
    name: upe-global-open
    runtime: node
    schedule: "35 14 * * 1-5"  # 09:35 ET (EST baseline)
    buildCommand: npm install
    startCommand: npm run worker:upe:global:open
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: upe-global-close
    runtime: node
    schedule: "5 21 * * 1-5"  # 16:05 ET (EST baseline)
    buildCommand: npm install
    startCommand: npm run worker:upe:global:close
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: upe-crcs-hourly
    runtime: node
    schedule: "8 * * * *"  # Hourly at :08 (staggered from other crons)
    buildCommand: npm install
    startCommand: npm run worker:upe:crcs:hourly
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # -----------------------------------------------------------------
  # Admin Edge Layer crons (HTTP endpoints under app/api/cron/*).
  # All five POST against the production web service with CRON_SECRET.
  # WEB_URL must match the rest of this file.
  # Required env on the WEB service (not these cron jobs):
  #   FRED_API_KEY            - admin-macro-ingest (no fallback)
  #   ALPHA_VANTAGE_API_KEY   - admin-edge-label-outcomes, admin-label-ai-outcomes
  # -----------------------------------------------------------------

  - type: cron
    name: admin-edge-label-outcomes
    runtime: node
    schedule: "0 */4 * * *"  # Every 4h - label MFE/MAE/realised R for pending setups
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 300 -X POST "$WEB_URL/api/cron/edge-label-outcomes?limit=500" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-edge-rebuild-matrix
    runtime: node
    schedule: "0 6 * * *"  # Daily 06:00 UTC - rebuild edge_ledger_matrix aggregates
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 300 -X POST "$WEB_URL/api/cron/edge-rebuild-matrix" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-macro-ingest
    runtime: node
    schedule: "0 9 * * 1-5"  # Weekdays 09:00 UTC - pull FRED macro series (FRED_API_KEY required on web service)
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 300 -X POST "$WEB_URL/api/cron/macro-ingest" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-label-ai-outcomes
    runtime: node
    schedule: "11 */6 * * *"  # Every 6h offset :11 - resolve outcomes on AI-recommended setups
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 300 -X POST "$WEB_URL/api/cron/label-ai-outcomes" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: admin-evening-packet
    runtime: node
    schedule: "0 22 * * *"  # Daily 22:00 UTC (~17:00 ET, after US close) - build + persist Evening Reconciliation Packet
    buildCommand: echo "Cron job ready"
    startCommand: curl -fL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 10 --max-time 300 -X POST "$WEB_URL/api/cron/evening-packet" -H "x-cron-secret:$CRON_SECRET" -H "Content-Type:application/json"
    envVars:
      - key: WEB_URL
        value: "https://marketscannerpros.app"
      - key: CRON_SECRET
        sync: false
